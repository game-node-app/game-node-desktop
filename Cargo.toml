[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/api", "crates/plugin-protocol", "crates/plugin-sdk", "crates/plugin-steam", "crates/plugin-packagekit", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# GPL-3.0-only is the repository license.
license = "GPL-3.0-only"
authors = ["GameNode"]
publish = false

[profile.dev]
debug = "line-tables-only"

# Dependencies (image, crypto, TLS, JSON) are slow unoptimized and rarely rebuilt.
[profile.dev.package."*"]
opt-level = 3

# Profile of the Windows packages built by `scripts/build-windows-wsl.sh`. The default unwinding
# panic strategy is kept on purpose: `panic = "abort"` is not set.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Workspace members (dependencies point inward: app -> platform/api -> core).
gamenode-core = { path = "crates/core" }
gamenode-platform = { path = "crates/platform" }
gamenode-api = { path = "crates/api" }
gamenode-plugin-protocol = { path = "crates/plugin-protocol" }

async-trait = "0.1.92"
getrandom = "0.4.3"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
percent-encoding = "2.3.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.54.1", default-features = false }
rustix = "1.1.6"
tracing = "0.1.44"
url = "2.5.8"
