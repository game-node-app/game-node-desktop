[package]
name = "gamenode-api"
description = "GameNode HTTP client: the existing authentication endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gamenode-core.workspace = true
async-trait.workspace = true
percent-encoding.workspace = true
# rustls (aws-lc-rs) TLS with the platform certificate verifier; no OpenSSL, no cookie store.
# gzip and deflate keep a compressed JSON response readable. Store clients that need
# browser-grade decompression (brotli, zstd) carry those features in their plugin crate.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "http2",
  "json",
  "system-proxy",
  "charset",
  "gzip",
  "deflate",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
httpmock = "0.9.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
