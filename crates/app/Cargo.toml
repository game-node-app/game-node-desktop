[package]
name = "gamenode-app"
description = "GameNode Desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "gamenode_app"
path = "src/lib.rs"

[[bin]]
name = "gamenode"
path = "src/main.rs"

[features]
# Serve the embedded `ui/dist` bundle instead of the Vite dev server (`devUrl`). Tauri treats a
# build without this feature as a dev build, so it stays on by default; use
# `--no-default-features` to point the window at `pnpm --dir ui dev` for HMR.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in allocator; default builds and tests keep the system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
gamenode-core.workspace = true
gamenode-platform.workspace = true
gamenode-api.workspace = true
gamenode-plugin-protocol.workspace = true
async-trait.workspace = true
mimalloc = { version = "0.1.52", optional = true }
futures-util = "0.3"
getrandom.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util"] }
tracing.workspace = true
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url.workspace = true
tonic = { version = "0.14", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"
windows-core = "0.62"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
gamenode-plugin-sdk = { path = "../plugin-sdk" }
gamenode-plugin-steam = { path = "../plugin-steam" }
httpmock = "0.9.0"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
