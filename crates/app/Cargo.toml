[package]
name = "gamenode-app"
description = "GameNode Desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "gamenode_app"
path = "src/lib.rs"

[[bin]]
name = "gamenode"
path = "src/main.rs"

[[bin]]
name = "gamenode-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "gamenode-cli"
path = "src/bin/cli.rs"

[features]
# Serve the embedded `ui/dist` bundle instead of the Vite dev server (`devUrl`). Tauri treats a
# build without this feature as a dev build, so it stays on by default; use
# `--no-default-features` to point the window at `pnpm --dir ui dev` for HMR.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
gamenode-core.workspace = true
gamenode-platform.workspace = true
gamenode-api.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url.workspace = true
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14"

[dev-dependencies]
httpmock = "0.9.0"
tempfile.workspace = true
