syntax = "proto3";
package gamenode.client.v1;

service Client {
  rpc GetStatus (Empty) returns (DaemonStatus);
  rpc GetAuthStatus (Empty) returns (AuthStatus);
  rpc StartLogin (StartLoginRequest) returns (AuthStatus);
  rpc SignOut (Empty) returns (AuthStatus);
  rpc SetSync (SyncSettings) returns (ActionReply);
  rpc SetPlaytimeSource (PlaytimeSourceRequest) returns (ActionReply);
  rpc ListInstallations (Empty) returns (InstallationSnapshot);
  rpc StartScan (Empty) returns (ScanStatus);
  rpc GetOperationStatus (OperationRequest) returns (OperationStatus);
  rpc PlayGame (GameRequest) returns (ActionReply);
  rpc InstallGame (GameRequest) returns (ActionReply);
  rpc RemoveGame (GameRequest) returns (ActionReply);
  rpc MatchGame (MatchRequest) returns (ActionReply);
  rpc SearchMatches (SearchMatchesRequest) returns (SearchMatchesReply);
  rpc MarkNoGame (GameRequest) returns (ActionReply);
  rpc ClearMatch (GameRequest) returns (ActionReply);
  rpc AddGame (AddGameRequest) returns (AddGameReply);
  rpc Stop (Empty) returns (StopReply);
}

message Empty {}
message DaemonStatus { string version = 1; string platform = 2; }
message AuthStatus { string state = 1; string account = 2; bool sync_enabled = 3; string playtime_source = 4; }
message StartLoginRequest { string provider = 1; }
message InstallationSnapshot {
  string access = 1;
  repeated Installation entries = 2;
  bool scanning = 3;
}
message Installation {
  string entry_key = 1;
  string provider = 2;
  string store_id = 3;
  string title = 4;
  string install_dir = 5;
  string match = 6;
  bool running = 7;
}
message ScanStatus { bool started = 1; string operation_id = 2; }
message OperationRequest { string operation_id = 1; }
message OperationStatus {
  string operation_id = 1;
  string kind = 2;
  string state = 3;
  string result_json = 4;
}
message GameRequest { string entry_key = 1; }
message MatchRequest { string entry_key = 1; uint64 game_id = 2; }
message SearchMatchesRequest { string entry_key = 1; string query = 2; }
message SearchMatchesReply { string results_json = 1; }
message AddGameRequest {
  string entry_key = 1;
  string status = 2;
  repeated string collection_ids = 3;
  bool status_only = 4;
  bool clear_collections = 5;
}
message AddGameReply { string summary_json = 1; }
message SyncSettings { bool enabled = 1; }
message PlaytimeSourceRequest { string source = 1; }
message ActionReply { bool accepted = 1; }
message StopReply { bool accepted = 1; }
