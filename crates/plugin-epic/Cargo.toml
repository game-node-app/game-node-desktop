[package]
name = "gamenode-plugin-epic"
description = "Official Epic Games Store provider plugin for GameNode Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
gamenode-plugin-protocol = { path = "../plugin-protocol" }
gamenode-plugin-sdk = { path = "../plugin-sdk" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
url.workspace = true

[dev-dependencies]
httpmock = "0.9.0"
tempfile.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
