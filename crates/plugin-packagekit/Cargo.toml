[package]
name = "gamenode-plugin-packagekit"
description = "Official Linux package manager game discovery plugin for GameNode Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-trait.workspace = true
gamenode-plugin-protocol = { path = "../plugin-protocol" }
gamenode-plugin-sdk = { path = "../plugin-sdk" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
futures-util = "0.3"
serde.workspace = true
zbus = "5.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
