// has no platform filter and a search is one bounded page (`page_size` defaults to 20, at most
// 50), so `MatchingSearchReply.next_cursor` is always empty.
message MatchingSearchRequest { ServiceContext context = 1; string query = 2; string platform = 3; uint32 page_size = 4; string cursor = 5; }
// Assigns one of the caller's own entries to a GameNode game. The entry is named by its
// `installation_id`; `provider_id` and `provider_game_id` are reserved and must be empty.
// `mutation.expected_revision` is the entry's `LibraryEntry.revision`. The reply's `resource_id`
// is the installation id and `revision` the entry's revision after the call.
message MatchingAssignRequest { MutationContext mutation = 1; string provider_id = 2; string provider_game_id = 3; string gamenode_game_id = 4; string installation_id = 5; }
// Reads the cover an own entry shows: the plugin's override, else the matched game's cover when it
// is already on the device (nothing is downloaded). `installation_id` is required; `game_id`, if
// set, must be the entry's current match. `artwork_kind` is "cover" or empty. `max_bytes` is the
// caller's budget: 0 means the 5 MiB maximum, larger values are capped to it, and an image over
// the budget is RESOURCE_EXHAUSTED rather than truncated.
message ArtworkReadRequest { ServiceContext context = 1; string game_id = 2; string installation_id = 3; string artwork_kind = 4; uint64 max_bytes = 5; }
// Sets the cover of one of the caller's own entries, or restores the game's cover when
// `encoded_image` is empty (then `media_type` must be empty too). The image is a static PNG, JPEG
// or WebP of at most 4 MiB and 4096 x 4096 pixels whose bytes match `media_type`; the host decodes,
// shrinks to fit 600 x 900 and re-encodes it, and stores its own output as that entry's cover. The
// matched game's cover and other entries are never changed. `mutation.expected_revision` is the
// entry's `LibraryEntry.artwork_revision`. The reply's `resource_id` is the installation id and
// `revision` the artwork revision after the call.
// The image comes either inline (`encoded_image`) or from a file the plugin may read
// (`file_handle`, a regular-file handle from the Files service, with `media_type` set as for
// inline bytes); giving both is INVALID_ARGUMENT. A handle needs `files.read` besides
// `artwork.write`, must come from an approval of this same installation, and its bytes are read by
// the host under the same 4 MiB bound and then decoded like inline ones. A path or a URL is never
// accepted: the handle is the only reference.
message ArtworkSetRequest { MutationContext mutation = 1; string game_id = 2; string installation_id = 3; string artwork_kind = 4; bytes encoded_image = 5; string media_type = 6; string file_handle = 7; }
