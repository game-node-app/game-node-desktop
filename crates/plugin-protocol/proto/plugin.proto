syntax = "proto3";
package gamenode.plugin.v1;

import "google/protobuf/struct.proto";

service PluginHost {
  rpc OpenSession (OpenSessionRequest) returns (OpenSessionReply);
  rpc SubmitDiscovery (SubmitDiscoveryRequest) returns (SubmitDiscoveryReply);
  // Authenticated control-plane methods; they never require data permissions.
  rpc DescribeApi (DescribeApiRequest) returns (DescribeApiReply);
  rpc GetPermissions (GetPermissionsRequest) returns (GetPermissionsReply);
  rpc WatchPermissionChanges (WatchPermissionChangesRequest) returns (stream PermissionChange);
}

message OpenSessionRequest {
  string plugin_id = 1;
  string plugin_version = 2;
  uint32 api_major = 3;
  uint32 api_minor = 4;
  bytes session_credential = 5;
  repeated string requested_capabilities = 6;
  // API 1.4+: range and feature fields. Empty range preserves API 1.1–1.3 behavior.
  uint32 min_api_major = 7;
  uint32 min_api_minor = 8;
  uint32 max_api_major = 9;
  uint32 max_api_minor = 10;
  repeated FeatureRequest features = 11;
  SessionKind session_kind = 12;
  optional TargetGameContext target_game = 13;
}

message OpenSessionReply {
  string session_id = 1;
  repeated string granted_capabilities = 2;
  uint32 api_major = 3;
  uint32 api_minor = 4;
  repeated FeatureStatus features = 5;
  SupportWindow support_window = 6;
}

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_PROVIDER = 1;
  SESSION_KIND_EXTENSION = 2;
}

message TargetGameContext {
  string game_id = 1;
  string installation_id = 2;
  string profile_id = 3;
  string revision = 4;
}

message FeatureRequest {
  string id = 1;
  bool required = 2;
}

enum FeatureAvailability {
  FEATURE_AVAILABILITY_UNSPECIFIED = 0;
  FEATURE_AVAILABILITY_SUPPORTED = 1;
  FEATURE_AVAILABILITY_UNSUPPORTED = 2;
  FEATURE_AVAILABILITY_DENIED = 3;
}

message FeatureStatus {
  string id = 1;
  FeatureAvailability availability = 2;
  uint32 introduced_minor = 3;
}

message SupportWindow {
  uint32 minimum_api_minor = 1;
  uint32 maximum_api_minor = 2;
  optional int64 support_ends_at = 3;
  string policy = 4;
}

message ApiFeature {
  string id = 1;
  uint32 introduced_minor = 2;
  repeated string permissions = 3;
  bool optional = 4;
  string availability = 5;
}

message ApiMethod {
  string service = 1;
  string method = 2;
  uint32 introduced_minor = 3;
  repeated string permissions = 4;
  string ownership = 5;
  uint32 max_page_size = 6;
  uint64 quota_bytes = 7;
  bool idempotent = 8;
}

message DescribeApiRequest {
  string session_id = 1;
  bytes session_credential = 2;
}
message DescribeApiReply {
  uint32 api_major = 1;
  uint32 api_minor = 2;
  SupportWindow support_window = 3;
  repeated ApiFeature features = 4;
  repeated ApiMethod methods = 5;
}

message GetPermissionsRequest {
  string session_id = 1;
  bytes session_credential = 2;
}
message PermissionGrant {
  string permission_id = 1;
  string state = 2;
  string scope = 3;
  string reason = 4;
  uint64 revision = 5;
}
message GetPermissionsReply {
  uint64 revision = 1;
  repeated PermissionGrant grants = 2;
}
message WatchPermissionChangesRequest {
  string session_id = 1;
  bytes session_credential = 2;
  uint64 after_revision = 3;
}
message PermissionChange {
  uint64 revision = 1;
  repeated PermissionGrant grants = 2;
  bool revoked = 3;
}

enum DenialReason {
  DENIAL_REASON_UNSPECIFIED = 0;
  DENIAL_REASON_NOT_GRANTED = 1;
  DENIAL_REASON_REVOKED = 2;
  DENIAL_REASON_SCOPE_DENIED = 3;
  DENIAL_REASON_REQUIRED_PERMISSION_MISSING = 4;
}
message DenialDetail {
  DenialReason reason = 1;
  string permission_id = 2;
  uint64 grant_revision = 3;
}

message DiscoveryRecord {
  string id = 1;
  string name = 2;
  string install_dir = 3;
  map<string, string> fields = 4;
}

message DiscoveryResult {
  repeated DiscoveryRecord records = 1;
  string provider_id = 2;
}

message PluginFailure {
  string code = 1;
  string message = 2;
}

message SubmitDiscoveryRequest {
  string session_id = 1;
  bytes session_credential = 2;
  string operation_id = 3;
  oneof outcome {
    DiscoveryResult completed = 4;
    PluginFailure failed = 5;
  }
}

message SubmitDiscoveryReply {
  bool accepted = 1;
}

// Full providers use this service on the same authenticated local endpoint.
// Discovery-only v1 clients may continue using PluginHost.SubmitDiscovery.
service ProviderHost {
  rpc Exchange (stream ProviderEvent) returns (stream ProviderCommand);
  rpc GetContext (ServiceContext) returns (ProviderContext);
  rpc Account (AccountRequest) returns (AccountReply);
  rpc Secret (SecretRequest) returns (SecretReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc DeclareActions (ActionRequest) returns (ActionReply);
}

// API 1.4 resource surface. Every request is scoped to a host-issued session
// and operation; implementations must recheck grants/revisions at commit.
service ResourceHost {
  rpc LibraryList (ResourceRequest) returns (ResourceReply);
  rpc LibraryGet (ResourceRequest) returns (ResourceReply);
  rpc LibraryWatch (ResourceRequest) returns (stream ResourceEvent);
  rpc MetadataUpdate (ResourceRequest) returns (ResourceReply);
  rpc FavoritesList (ResourceRequest) returns (ResourceReply);
  rpc FavoritesSet (ResourceRequest) returns (ResourceReply);
  rpc MatchingSearch (ResourceRequest) returns (ResourceReply);
  rpc MatchingAssign (ResourceRequest) returns (ResourceReply);
  rpc ArtworkRead (ResourceRequest) returns (ResourceReply);
  rpc ArtworkSet (ResourceRequest) returns (ResourceReply);
  rpc GamesRequestLaunch (GameLaunchRequest) returns (ResourceReply);
  rpc GamesProposeCustomLaunch (CustomLaunchRequest) returns (ResourceReply);
  rpc GamesRequestCustomLaunch (CustomLaunchRequest) returns (ResourceReply);
  rpc GamesRemoveCustomLaunch (ResourceRequest) returns (ResourceReply);
  rpc GamesRequestInstall (ResourceRequest) returns (ResourceReply);
  rpc StorageGet (ResourceRequest) returns (ResourceReply);
  rpc StoragePut (ResourceRequest) returns (ResourceReply);
  rpc StorageDelete (ResourceRequest) returns (ResourceReply);
  rpc FilesRequestAccess (ResourceRequest) returns (ResourceReply);
  rpc FilesList (ResourceRequest) returns (ResourceReply);
  rpc FilesRead (ResourceRequest) returns (ResourceReply);
  rpc FilesWrite (ResourceRequest) returns (ResourceReply);
  rpc FilesDelete (ResourceRequest) returns (ResourceReply);
  rpc NetworkFetch (ResourceRequest) returns (ResourceReply);
  rpc NotificationsPublish (ResourceRequest) returns (ResourceReply);
  rpc BackupsList (ResourceRequest) returns (ResourceReply);
  rpc BackupsRequestCreate (ResourceRequest) returns (ResourceReply);
  rpc BackupsRequestRestore (ResourceRequest) returns (ResourceReply);
  rpc LibrariesList (ResourceRequest) returns (ResourceReply);
  rpc LibrariesGet (ResourceRequest) returns (ResourceReply);
  rpc LibrariesWatch (ResourceRequest) returns (stream ResourceEvent);
  rpc LibrariesCreate (ResourceRequest) returns (ResourceReply);
  rpc LibrariesUpdate (ResourceRequest) returns (ResourceReply);
  rpc LibrariesRemove (ResourceRequest) returns (ResourceReply);
  rpc LibrariesAddRoot (ResourceRequest) returns (ResourceReply);
  rpc LibrariesUpdateRoot (ResourceRequest) returns (ResourceReply);
  rpc LibrariesRemoveRoot (ResourceRequest) returns (ResourceReply);
  rpc RuntimesList (ResourceRequest) returns (ResourceReply);
  rpc RuntimesGet (ResourceRequest) returns (ResourceReply);
  rpc RuntimesWatch (ResourceRequest) returns (stream ResourceEvent);
  rpc RuntimesRegister (ResourceRequest) returns (ResourceReply);
  rpc RuntimesUpdate (ResourceRequest) returns (ResourceReply);
  rpc RuntimesRemove (ResourceRequest) returns (ResourceReply);
  rpc GamesRegisterContent (ResourceRequest) returns (ResourceReply);
  rpc StorageDiagnosticsPublishBenchmark (ResourceRequest) returns (ResourceReply);
  rpc StorageDiagnosticsPublishSmart (ResourceRequest) returns (ResourceReply);
  rpc ComputerPublishHardware (ResourceRequest) returns (ResourceReply);
  rpc GamePresencePublish (ResourceRequest) returns (ResourceReply);
  rpc GamePresenceClear (ResourceRequest) returns (ResourceReply);
  rpc GamePerformancePublishSamples (ResourceRequest) returns (ResourceReply);
  rpc GamePerformanceEndSeries (ResourceRequest) returns (ResourceReply);
  rpc DataPublish (ResourceRequest) returns (ResourceReply);
  rpc DataGet (ResourceRequest) returns (ResourceReply);
  rpc DataList (ResourceRequest) returns (ResourceReply);
  rpc DataWatch (ResourceRequest) returns (stream ResourceEvent);
  rpc PersistenceGetUsage (ResourceRequest) returns (ResourceReply);
  rpc PersistenceListEntries (ResourceRequest) returns (ResourceReply);
  rpc PersistenceDeleteEntries (ResourceRequest) returns (ResourceReply);
  rpc PersistenceClear (ResourceRequest) returns (ResourceReply);
  rpc PersistenceSetRetentionPolicy (ResourceRequest) returns (ResourceReply);
  rpc ToolsList (ResourceRequest) returns (ResourceReply);
  rpc ToolsRequestApply (ResourceRequest) returns (ResourceReply);
  rpc ToolsRequestRemove (ResourceRequest) returns (ResourceReply);
  rpc PortsList (ResourceRequest) returns (ResourceReply);
  rpc PortsDetail (ResourceRequest) returns (ResourceReply);
  rpc PortsRequestInstall (ResourceRequest) returns (ResourceReply);
  rpc JobsGet (ResourceRequest) returns (ResourceReply);
  rpc JobsWatch (ResourceRequest) returns (stream ResourceEvent);
  rpc JobsCancel (ResourceRequest) returns (ResourceReply);
}

message ResourceRequest {
  ServiceContext context = 1;
  string resource_id = 2;
  string operation_id = 3;
  string idempotency_key = 4;
  uint64 expected_revision = 5;
  string cursor = 6;
  uint32 page_size = 7;
  uint64 max_bytes = 8;
  string durability = 9;
  bytes payload = 10;
  // Deprecated API 1.4 draft fields. Kept at their original wire numbers so
  // clients compiled against the draft remain wire-decodable; hosts MUST NOT
  // use these untyped fields to authorize or include shared records.
  bool include_common = 11 [deprecated = true];
  repeated string selected_categories = 12 [deprecated = true];
  // Omitted or empty means private/owner-visible records only. Each requested
  // category is independently checked against the caller's current grant.
  CommonDataSelector common_data_categories = 13;
}

// Explicit, per-query opt-in to standard shared projections. A grant selected
// during activation only permits a category; it never causes automatic reads.
// Secrets and sensitive/custom datasets are not representable here.
message CommonDataSelector {
  repeated CommonDataCategory categories = 1;
}

enum CommonDataCategory {
  COMMON_DATA_CATEGORY_UNSPECIFIED = 0;
  COMMON_DATA_CATEGORY_GAME_PATHS = 1;
  COMMON_DATA_CATEGORY_GAME_PERFORMANCE_HISTORY = 2;
  COMMON_DATA_CATEGORY_RUNTIME_CATALOG = 3;
  COMMON_DATA_CATEGORY_CONTENT_AVAILABILITY = 4;
}
message ResourceReply {
  string resource_id = 1;
  uint64 revision = 2;
  string next_cursor = 3;
  uint64 usage_bytes = 4;
  uint64 quota_bytes = 5;
  string job_id = 6;
  string outcome = 7;
  bytes payload = 8;
}
message ResourceEvent {
  uint64 revision = 1;
  string resource_id = 2;
  string event_type = 3;
  bytes payload = 4;
}
message GameLaunchRequest {
  ServiceContext context = 1;
  string game_id = 2;
  string installation_id = 3;
  uint64 expected_revision = 4;
  string user_intent_id = 5;
  string idempotency_key = 6;
}
message CustomLaunchRequest {
  ServiceContext context = 1;
  string game_id = 2;
  string installation_id = 3;
  uint64 expected_revision = 4;
  string user_intent_id = 5;
  string idempotency_key = 6;
  string executable_handle = 7;
  repeated string argv = 8;
  string working_directory_handle = 9;
  map<string, string> environment_set = 10;
  repeated string environment_unset = 11;
  string runtime_handle = 12;
}

// Extensible application metadata. Typed identity, ownership, grants, revisions
// and execution fields stay outside Struct and are never inferred from it.
message ExtensionPayload {
  string schema_id = 1;
  uint32 schema_version = 2;
  bytes schema_digest = 3;
  google.protobuf.Struct data = 4;
}

enum ExtensionFieldClassification {
  EXTENSION_FIELD_CLASSIFICATION_UNSPECIFIED = 0;
  EXTENSION_FIELD_CLASSIFICATION_PUBLIC = 1;
  EXTENSION_FIELD_CLASSIFICATION_SENSITIVE = 2;
  EXTENSION_FIELD_CLASSIFICATION_PRIVATE = 3;
}

message ExtensionSchemaField {
  string path = 1;
  ExtensionFieldClassification classification = 2;
}

// Declarative package asset; schema_json is bounded data, never executable code.
message ExtensionSchemaDescriptor {
  string namespace = 1;
  string schema_id = 2;
  uint32 schema_version = 3;
  bytes schema_digest = 4;
  bytes schema_json = 5;
  repeated ExtensionSchemaField fields = 6;
  bool optional = 7;
}

message ExtensionNamespacePatch {
  string namespace = 1;
  oneof operation {
    ExtensionPayload set = 2;
    bool remove = 3;
  }
}

message ExtensionPatch {
  uint64 expected_revision = 1;
  repeated string typed_field_mask = 2;
  repeated ExtensionNamespacePatch namespaces = 3;
}

// Example hybrid resource: exact revisions/timestamps remain typed integers.
message RuntimeRecord {
  string id = 1;
  string name = 2;
  string version = 3;
  string executable_handle = 4;
  repeated string supported_formats = 5;
  map<string, ExtensionPayload> extensions = 6;
  uint64 revision = 7;
  int64 observed_at = 8;
}

// Epochs and operation ids are issued by the host; clients cannot widen them.
message ServiceContext {
  string session_id = 1;
  bytes session_credential = 2;
  string provider_id = 3;
  string operation_id = 4;
  uint64 account_epoch = 5;
  uint64 profile_epoch = 6;
  SessionKind session_kind = 7;
  optional TargetGameContext target_game = 8;
}

enum ProviderOperation {
  PROVIDER_OPERATION_UNSPECIFIED = 0;
  PROVIDER_OPERATION_INITIALIZE = 1;
  PROVIDER_OPERATION_DISCOVER = 2;
  PROVIDER_OPERATION_SIGN_IN = 3;
  PROVIDER_OPERATION_FOCUS_SIGN_IN = 4;
  PROVIDER_OPERATION_CANCEL_SIGN_IN = 5;
  PROVIDER_OPERATION_CHECK = 6;
  PROVIDER_OPERATION_SYNC_CATALOG = 7;
  PROVIDER_OPERATION_SIGN_OUT = 8;
  PROVIDER_OPERATION_READ_COUNTER = 9;
  PROVIDER_OPERATION_CANCEL = 10;
  PROVIDER_OPERATION_SHUTDOWN = 11;
  PROVIDER_OPERATION_ACKNOWLEDGE = 12;
  PROVIDER_OPERATION_SETTINGS_DESCRIBE_READ = 13;
  PROVIDER_OPERATION_SETTINGS_SUBMIT = 14;
  PROVIDER_OPERATION_SETTINGS_CANCEL = 15;
  PROVIDER_OPERATION_CONFIGURATION_OPEN = 16;
  PROVIDER_OPERATION_CONFIGURATION_FOCUS = 17;
  PROVIDER_OPERATION_CONFIGURATION_CLOSE = 18;
}

message ProviderCommand {
  ServiceContext context = 1;
  ProviderOperation operation = 2;
  string target_operation_id = 3;
  optional SettingsRequest settings = 4;
}

message ProviderContext {
  string provider_id = 1;
  string platform = 2;
  string manifest_toml = 3;
  repeated string granted_capabilities = 4;
  uint32 max_records = 5;
  uint32 max_message_bytes = 6;
  uint32 catalog_chunk_records = 7;
  SecretStorage secret_storage = 8;
}

enum AccountConnection {
  ACCOUNT_CONNECTION_UNSPECIFIED = 0;
  ACCOUNT_CONNECTION_NOT_CONNECTED = 1;
  ACCOUNT_CONNECTION_CHECKING = 2;
  ACCOUNT_CONNECTION_SIGNING_IN = 3;
  ACCOUNT_CONNECTION_CONNECTED = 4;
  ACCOUNT_CONNECTION_EXPIRED = 5;
  ACCOUNT_CONNECTION_UNREACHABLE = 6;
  ACCOUNT_CONNECTION_CREDENTIAL_ERROR = 7;
}

enum SecretStorage {
  SECRET_STORAGE_UNSPECIFIED = 0;
  SECRET_STORAGE_WINDOWS_CREDENTIAL_MANAGER = 1;
  SECRET_STORAGE_SECRET_SERVICE = 2;
  SECRET_STORAGE_PRIVATE_FILE = 3;
}

enum CatalogFailure {
  CATALOG_FAILURE_UNSPECIFIED = 0;
  CATALOG_FAILURE_UNREACHABLE = 1;
  CATALOG_FAILURE_RATE_LIMITED = 2;
  CATALOG_FAILURE_SERVER = 3;
  CATALOG_FAILURE_EXPIRED = 4;
  CATALOG_FAILURE_PRIVACY = 5;
  CATALOG_FAILURE_CHANGED = 6;
  CATALOG_FAILURE_INVALID_COOKIES = 7;
  CATALOG_FAILURE_FAMILY_UNAVAILABLE = 8;
}

message AccountIdentity {
  string provider_id = 1;
  string account_id = 2;
  optional string account_name = 3;
  optional int64 last_verified_at = 4;
}

message AccountStatus {
  AccountConnection state = 1;
  optional string account_id = 2;
  optional string account_name = 3;
  optional int64 last_checked_at = 4;
  optional int64 last_synced_at = 5;
  SecretStorage storage = 6;
  bool persist_failed = 7;
  optional CatalogFailure catalog_error = 8;
  optional CatalogFailure family_error = 9;
}

message AccountRequest {
  ServiceContext context = 1;
  oneof action {
    bool read = 2;
    AccountIdentity save = 3;
    bool clear = 4;
  }
}

message AccountReply {
  optional AccountIdentity account = 1;
  bool accepted = 2;
}

enum SecretOperation {
  SECRET_OPERATION_UNSPECIFIED = 0;
  SECRET_OPERATION_READ = 1;
  SECRET_OPERATION_WRITE = 2;
  SECRET_OPERATION_DELETE = 3;
}

enum ServiceFailure {
  SERVICE_FAILURE_UNSPECIFIED = 0;
  SERVICE_FAILURE_LOCKED = 1;
  SERVICE_FAILURE_FAILED = 2;
  SERVICE_FAILURE_STALE_OPERATION = 3;
}

// Never log the request/reply or include the value in UI state.
message SecretRequest {
  ServiceContext context = 1;
  string key = 2;
  SecretOperation operation = 3;
  optional bytes value = 4;
}

message SecretReply {
  SecretStorage storage = 1;
  oneof outcome {
    bytes value = 2;
    bool absent = 3;
    bool accepted = 4;
    ServiceFailure failed = 5;
  }
}

enum LoginOperation {
  LOGIN_OPERATION_UNSPECIFIED = 0;
  LOGIN_OPERATION_OPEN = 1;
  LOGIN_OPERATION_READ = 2;
  LOGIN_OPERATION_FOCUS = 3;
  LOGIN_OPERATION_CANCEL = 4;
  LOGIN_OPERATION_CLOSE = 5;
}

enum LoginState {
  LOGIN_STATE_UNSPECIFIED = 0;
  LOGIN_STATE_OPEN = 1;
  LOGIN_STATE_CLOSED = 2;
  LOGIN_STATE_CANCELLED = 3;
  LOGIN_STATE_TIMED_OUT = 4;
  LOGIN_STATE_FAILED = 5;
}

message LoginRequest {
  ServiceContext context = 1;
  LoginOperation operation = 2;
  string handle = 3;
}

message LoginCookie {
  string name = 1;
  string value = 2;
}

// Extraction policy is trusted packaged data, never supplied in LoginRequest.
message LoginReply {
  string handle = 1;
  LoginState state = 2;
  repeated LoginCookie cookies = 3;
  optional string page_result_json = 4;
}

message ActionDeclaration {
  optional string play_uri = 1;
  optional string install_uri = 2;
}

message ActionRequest {
  ServiceContext context = 1;
  ActionDeclaration actions = 2;
}

message ActionReply {
  bool accepted = 1;
}

message CatalogGame {
  string id = 1;
  string name = 2;
}

enum CatalogCategory {
  CATALOG_CATEGORY_UNSPECIFIED = 0;
  CATALOG_CATEGORY_OWNED = 1;
  CATALOG_CATEGORY_FAMILY = 2;
}

message CatalogChunk {
  CatalogCategory category = 1;
  uint32 index = 2;
  repeated CatalogGame games = 3;
}

message CatalogCompletion {
  CatalogCategory category = 1;
  oneof outcome {
    uint32 completed_records = 2;
    CatalogFailure failed = 3;
    bool unchanged = 4;
  }
}

message CounterObservation {
  string id = 1;
  int64 seconds = 2;
  int64 last_played = 3;
}

enum OperationDisposition {
  OPERATION_DISPOSITION_UNSPECIFIED = 0;
  OPERATION_DISPOSITION_COMPLETED = 1;
  OPERATION_DISPOSITION_CANCELLED = 2;
  OPERATION_DISPOSITION_SUPERSEDED = 3;
  OPERATION_DISPOSITION_FAILED = 4;
}

enum AccountLoginOutcome {
  ACCOUNT_LOGIN_OUTCOME_UNSPECIFIED = 0;
  ACCOUNT_LOGIN_OUTCOME_CONNECTED = 1;
  ACCOUNT_LOGIN_OUTCOME_CANCELLED = 2;
  ACCOUNT_LOGIN_OUTCOME_CLOSED = 3;
  ACCOUNT_LOGIN_OUTCOME_TIMED_OUT = 4;
  ACCOUNT_LOGIN_OUTCOME_FAILED = 5;
  ACCOUNT_LOGIN_OUTCOME_SUPERSEDED = 6;
}

message OperationResult {
  OperationDisposition disposition = 1;
  optional AccountStatus status = 2;
  bool account_changed = 3;
  bool signed_out = 4;
  optional DiscoveryResult discovery = 5;
  repeated CounterObservation counters = 6;
  repeated CatalogCompletion catalogs = 7;
  int64 observed_at = 8;
  optional PluginFailure failure = 9;
  optional AccountLoginOutcome login_outcome = 10;
  optional bool focused = 11;
  optional SettingsReply settings = 12;
  optional ConfigurationResult configuration = 13;
}

message ConfigurationResult {
  string session_id = 1;
  string profile_id = 2;
  string window_id = 3;
  bool accepted = 4;
  string failure = 5;
}

// Optional ui.settings, negotiated independently at API 1.3. This closed schema
// carries non-secret configuration only; it grants no executable UI or storage.
message SettingsContext {
  string plugin_id = 1;
  string provider_id = 2;
  string session_id = 3;
  uint64 profile_epoch = 4;
  string form_handle = 5;
}

message SettingsText {
  string fallback = 1;
  map<string, string> translations = 2;
}

message SettingsValue {
  oneof value {
    bool boolean = 1;
    string text = 2;
    double number = 3;
    string choice = 4;
  }
}

message SettingsTextField {
  uint32 min_length = 1;
  uint32 max_length = 2;
}

message SettingsNumberField {
  double min = 1;
  double max = 2;
  double step = 3;
}

message SettingsChoiceOption {
  string id = 1;
  SettingsText label = 2;
}

message SettingsChoiceField {
  repeated SettingsChoiceOption options = 1;
}

message SettingsField {
  string id = 1;
  SettingsText label = 2;
  optional SettingsText help = 3;
  SettingsValue default_value = 4;
  oneof kind {
    bool boolean = 5;
    SettingsTextField text = 6;
    SettingsNumberField number = 7;
    SettingsChoiceField choice = 8;
  }
}

message SettingsForm {
  uint32 schema_version = 1;
  string form_id = 2;
  string schema_revision = 3;
  string configuration_revision = 4;
  SettingsText title = 5;
  repeated SettingsField fields = 6;
}

message SettingsSubmission {
  string schema_revision = 1;
  string configuration_revision = 2;
  map<string, SettingsValue> values = 3;
}

message SettingsRequest {
  SettingsContext context = 1;
  oneof action {
    bool describe_read = 2;
    SettingsSubmission submit = 3;
    bool cancel = 4;
  }
}

message SettingsView {
  SettingsForm form = 1;
  map<string, SettingsValue> values = 2;
}

enum SettingsPersistence {
  SETTINGS_PERSISTENCE_UNSPECIFIED = 0;
  SETTINGS_PERSISTENCE_PERSISTED = 1;
  SETTINGS_PERSISTENCE_SESSION_ONLY = 2;
}

message SettingsApplied {
  string configuration_revision = 1;
  SettingsPersistence persistence = 2;
}

message SettingsFieldErrors {
  map<string, SettingsText> errors = 1;
}

enum SettingsFailure {
  SETTINGS_FAILURE_UNSPECIFIED = 0;
  SETTINGS_FAILURE_DENIED = 1;
  SETTINGS_FAILURE_UNAVAILABLE = 2;
  SETTINGS_FAILURE_TIMED_OUT = 3;
  SETTINGS_FAILURE_CANCELLED = 4;
  SETTINGS_FAILURE_STALE = 5;
  SETTINGS_FAILURE_INVALID = 6;
  SETTINGS_FAILURE_PERSISTENCE_FAILED = 7;
}

message SettingsReply {
  SettingsContext context = 1;
  oneof outcome {
    SettingsView form = 2;
    SettingsApplied applied = 3;
    SettingsFieldErrors field_errors = 4;
    string revision_conflict = 5;
    SettingsFailure failed = 6;
  }
}

message ProviderEvent {
  ServiceContext context = 1;
  oneof event {
    bool ready = 2;
    AccountStatus account_status = 3;
    CatalogChunk catalog_chunk = 4;
    OperationResult result = 5;
  }
}
