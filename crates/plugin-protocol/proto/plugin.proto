syntax = "proto3";
package gamenode.plugin.v1;

import "google/protobuf/struct.proto";

service PluginHost {
  rpc OpenSession (OpenSessionRequest) returns (OpenSessionReply);
  rpc SubmitDiscovery (SubmitDiscoveryRequest) returns (SubmitDiscoveryReply);
  // Authenticated control-plane methods; they never require data permissions.
  rpc DescribeApi (DescribeApiRequest) returns (DescribeApiReply);
  rpc GetPermissions (GetPermissionsRequest) returns (GetPermissionsReply);
  rpc WatchPermissionChanges (WatchPermissionChangesRequest) returns (stream PermissionChange);
}

message OpenSessionRequest {
  string plugin_id = 1;
  string plugin_version = 2;
  uint32 api_major = 3;
  uint32 api_minor = 4;
  bytes session_credential = 5;
  repeated string requested_capabilities = 6;
  // API 1.4+: range and feature fields. Empty range preserves API 1.1–1.3 behavior.
  uint32 min_api_major = 7;
  uint32 min_api_minor = 8;
  uint32 max_api_major = 9;
  uint32 max_api_minor = 10;
  repeated FeatureRequest features = 11;
  SessionKind session_kind = 12;
  optional TargetGameContext target_game = 13;
}

message OpenSessionReply {
  string session_id = 1;
  repeated string granted_capabilities = 2;
  uint32 api_major = 3;
  uint32 api_minor = 4;
  repeated FeatureStatus features = 5;
  SupportWindow support_window = 6;
}

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_PROVIDER = 1;
  SESSION_KIND_EXTENSION = 2;
}

message TargetGameContext {
  string game_id = 1;
  string installation_id = 2;
  string profile_id = 3;
  string revision = 4;
}

message FeatureRequest {
  string id = 1;
  bool required = 2;
}

enum FeatureAvailability {
  FEATURE_AVAILABILITY_UNSPECIFIED = 0;
  FEATURE_AVAILABILITY_SUPPORTED = 1;
  FEATURE_AVAILABILITY_UNSUPPORTED = 2;
  FEATURE_AVAILABILITY_DENIED = 3;
}

message FeatureStatus {
  string id = 1;
  FeatureAvailability availability = 2;
  uint32 introduced_minor = 3;
}

message SupportWindow {
  uint32 minimum_api_minor = 1;
  uint32 maximum_api_minor = 2;
  optional int64 support_ends_at = 3;
  string policy = 4;
}

message ApiFeature {
  string id = 1;
  uint32 introduced_minor = 2;
  repeated string permissions = 3;
  bool optional = 4;
  string availability = 5;
}

message ApiMethod {
  string service = 1;
  string method = 2;
  uint32 introduced_minor = 3;
  repeated string permissions = 4;
  string ownership = 5;
  uint32 max_page_size = 6;
  uint64 quota_bytes = 7;
  bool idempotent = 8;
}

message DescribeApiRequest {
  string session_id = 1;
  bytes session_credential = 2;
}
message DescribeApiReply {
  uint32 api_major = 1;
  uint32 api_minor = 2;
  SupportWindow support_window = 3;
  repeated ApiFeature features = 4;
  repeated ApiMethod methods = 5;
}

message GetPermissionsRequest {
  string session_id = 1;
  bytes session_credential = 2;
}
message PermissionGrant {
  string permission_id = 1;
  string state = 2;
  string scope = 3;
  string reason = 4;
  uint64 revision = 5;
}
message GetPermissionsReply {
  uint64 revision = 1;
  repeated PermissionGrant grants = 2;
}
message WatchPermissionChangesRequest {
  string session_id = 1;
  bytes session_credential = 2;
  uint64 after_revision = 3;
}
message PermissionChange {
  uint64 revision = 1;
  repeated PermissionGrant grants = 2;
  bool revoked = 3;
}

enum DenialReason {
  DENIAL_REASON_UNSPECIFIED = 0;
  DENIAL_REASON_NOT_GRANTED = 1;
  DENIAL_REASON_REVOKED = 2;
  DENIAL_REASON_SCOPE_DENIED = 3;
  DENIAL_REASON_REQUIRED_PERMISSION_MISSING = 4;
}
message DenialDetail {
  DenialReason reason = 1;
  string permission_id = 2;
  uint64 grant_revision = 3;
}

message DiscoveryRecord {
  string id = 1;
  string name = 2;
  string install_dir = 3;
  map<string, string> fields = 4;
}

message DiscoveryResult {
  repeated DiscoveryRecord records = 1;
  string provider_id = 2;
}

message PluginFailure {
  string code = 1;
  string message = 2;
}

message SubmitDiscoveryRequest {
  string session_id = 1;
  bytes session_credential = 2;
  string operation_id = 3;
  oneof outcome {
    DiscoveryResult completed = 4;
    PluginFailure failed = 5;
  }
}

message SubmitDiscoveryReply {
  bool accepted = 1;
}

// Full providers use this service on the same authenticated local endpoint.
// Discovery-only v1 clients may continue using PluginHost.SubmitDiscovery.
service ProviderHost {
  rpc Exchange (stream ProviderEvent) returns (stream ProviderCommand);
  rpc GetContext (ServiceContext) returns (ProviderContext);
  rpc Account (AccountRequest) returns (AccountReply);
  rpc Secret (SecretRequest) returns (SecretReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc DeclareActions (ActionRequest) returns (ActionReply);
}

// API 1.4 resource surface. Every request is scoped to a host-issued session
// and operation; implementations must recheck grants/revisions at commit.
service ResourceHost {
  rpc LibraryList (LibraryListRequest) returns (LibraryListReply);
  rpc LibraryGet (LibraryGetRequest) returns (LibraryGetReply);
  rpc LibraryWatch (LibraryWatchRequest) returns (stream LibraryEvent);
  rpc MetadataUpdate (MetadataUpdateRequest) returns (MutationReply);
  rpc FavoritesList (FavoritesListRequest) returns (FavoritesListReply);
  rpc FavoritesSet (FavoritesSetRequest) returns (MutationReply);
  rpc MatchingSearch (MatchingSearchRequest) returns (MatchingSearchReply);
  rpc MatchingAssign (MatchingAssignRequest) returns (MutationReply);
  rpc ArtworkRead (ArtworkReadRequest) returns (ArtworkReadReply);
  rpc ArtworkSet (ArtworkSetRequest) returns (MutationReply);
  rpc GamesRequestLaunch (GameLaunchRequest) returns (GameLaunchReply);
  rpc GamesProposeCustomLaunch (CustomLaunchRequest) returns (CustomLaunchReply);
  rpc GamesRequestCustomLaunch (CustomLaunchRequest) returns (CustomLaunchReply);
  rpc GamesRemoveCustomLaunch (CustomLaunchRemoveRequest) returns (MutationReply);
  rpc GamesRequestInstall (GameInstallRequest) returns (JobReply);
  rpc StorageGet (StorageGetRequest) returns (StorageGetReply);
  rpc StoragePut (StoragePutRequest) returns (StorageMutationReply);
  rpc StorageDelete (StorageDeleteRequest) returns (MutationReply);
  rpc FilesRequestAccess (FilesRequestAccessRequest) returns (FileAccessReply);
  rpc FilesList (FilesListRequest) returns (FilesListReply);
  rpc FilesRead (FilesReadRequest) returns (FileReadReply);
  rpc FilesWrite (FilesWriteRequest) returns (MutationReply);
  rpc FilesDelete (FilesDeleteRequest) returns (MutationReply);
  rpc NetworkFetch (NetworkFetchRequest) returns (NetworkFetchReply);
  rpc NotificationsPublish (NotificationPublishRequest) returns (MutationReply);
  rpc BackupsList (BackupsListRequest) returns (BackupsListReply);
  rpc BackupsRequestCreate (BackupCreateRequest) returns (JobReply);
  rpc BackupsRequestRestore (BackupRestoreRequest) returns (JobReply);
  rpc LibrariesList (DomainListRequest) returns (LibrariesListReply);
  rpc LibrariesGet (DomainGetRequest) returns (LibraryRecordReply);
  rpc LibrariesWatch (DomainWatchRequest) returns (stream LibraryRecordEvent);
  rpc LibrariesCreate (LibraryCreateRequest) returns (LibraryMutationReply);
  rpc LibrariesUpdate (LibraryUpdateRequest) returns (LibraryMutationReply);
  rpc LibrariesRemove (DomainRemoveRequest) returns (MutationReply);
  rpc LibrariesAddRoot (LibraryRootAddRequest) returns (LibraryMutationReply);
  rpc LibrariesUpdateRoot (LibraryRootUpdateRequest) returns (LibraryMutationReply);
  rpc LibrariesRemoveRoot (LibraryRootRemoveRequest) returns (MutationReply);
  rpc RuntimesList (DomainListRequest) returns (RuntimesListReply);
  rpc RuntimesGet (DomainGetRequest) returns (RuntimeRecordReply);
  rpc RuntimesWatch (DomainWatchRequest) returns (stream RuntimeRecordEvent);
  rpc RuntimesRegister (RuntimeRegisterRequest) returns (RuntimeMutationReply);
  rpc RuntimesUpdate (RuntimeUpdateRequest) returns (RuntimeMutationReply);
  rpc RuntimesRemove (DomainRemoveRequest) returns (MutationReply);
  rpc GamesRegisterContent (ContentRegistrationRequest) returns (MutationReply);
  rpc StorageDiagnosticsPublishBenchmark (BenchmarkReportRequest) returns (ReportMutationReply);
  rpc StorageDiagnosticsPublishSmart (SmartReportRequest) returns (ReportMutationReply);
  rpc ComputerPublishHardware (HardwareReportRequest) returns (ReportMutationReply);
  rpc GamePresencePublish (PresencePublishRequest) returns (ReportMutationReply);
  rpc GamePresenceClear (PresenceClearRequest) returns (MutationReply);
  rpc GamePerformancePublishSamples (PerformanceSamplesRequest) returns (ReportMutationReply);
  rpc GamePerformanceEndSeries (PerformanceEndSeriesRequest) returns (MutationReply);
  rpc DataPublish (DataPublishRequest) returns (DataMutationReply);
  rpc DataGet (DataGetRequest) returns (DataGetReply);
  rpc DataList (DataListRequest) returns (DataListReply);
  rpc DataWatch (DataWatchRequest) returns (stream DataEvent);
  rpc PersistenceGetUsage (PersistenceUsageRequest) returns (PersistenceUsageReply);
  rpc PersistenceListEntries (PersistenceListRequest) returns (PersistenceListReply);
  rpc PersistenceDeleteEntries (PersistenceDeleteRequest) returns (MutationReply);
  rpc PersistenceClear (PersistenceClearRequest) returns (MutationReply);
  rpc PersistenceSetRetentionPolicy (RetentionPolicyRequest) returns (MutationReply);
  rpc ToolsList (ToolsListRequest) returns (ToolsListReply);
  rpc ToolsRequestApply (ToolApplyRequest) returns (JobReply);
  rpc ToolsRequestRemove (ToolRemoveRequest) returns (JobReply);
  rpc PortsList (PortsListRequest) returns (PortsListReply);
  rpc PortsDetail (PortDetailRequest) returns (PortDetailReply);
  rpc PortsRequestInstall (PortInstallRequest) returns (JobReply);
  rpc JobsGet (JobGetRequest) returns (JobReply);
  rpc JobsWatch (JobWatchRequest) returns (stream JobEvent);
  rpc JobsCancel (JobCancelRequest) returns (JobReply);
}

service Saves {
  rpc ListProfiles (SaveProfileListRequest) returns (SaveProfileListReply);
  rpc GetProfile (SaveProfileGetRequest) returns (SaveProfileReply);
  rpc CreateProfile (SaveProfileCreateRequest) returns (SaveProfileMutationReply);
  rpc UpdateProfile (SaveProfileUpdateRequest) returns (SaveProfileMutationReply);
  rpc RemoveProfile (SaveProfileRemoveRequest) returns (SaveProfileMutationReply);
}

service Locations {
  rpc Inspect (LocationInspectRequest) returns (LocationInspectReply);
  rpc GetSize (LocationSizeRequest) returns (LocationSizeReply);
  rpc GetAccess (LocationAccessRequest) returns (LocationAccessReply);
  rpc GetLastModified (LocationLastModifiedRequest) returns (LocationLastModifiedReply);
  rpc GetFingerprint (LocationFingerprintRequest) returns (LocationFingerprintReply);
  rpc Compare (LocationCompareRequest) returns (LocationCompareReply);
  rpc WatchAvailability (LocationAvailabilityWatchRequest) returns (stream LocationAvailabilityEvent);
}

service StorageDiagnostics {
  rpc List (DiagnosticListRequest) returns (DiagnosticListReply);
  rpc Get (DiagnosticGetRequest) returns (DiagnosticGetReply);
  rpc Watch (DiagnosticWatchRequest) returns (stream DiagnosticEvent);
}

service Computer {
  rpc List (ComputerListRequest) returns (ComputerListReply);
  rpc Get (ComputerGetRequest) returns (ComputerGetReply);
  rpc Watch (ComputerWatchRequest) returns (stream ComputerEvent);
}

service GamePresence {
  rpc List (PresenceListRequest) returns (PresenceListReply);
  rpc Get (PresenceGetRequest) returns (PresenceGetReply);
  rpc Watch (PresenceWatchRequest) returns (stream PresenceEvent);
}

service GamePerformance {
  rpc List (PerformanceListRequest) returns (PerformanceListReply);
  rpc Get (PerformanceGetRequest) returns (PerformanceGetReply);
  rpc Watch (PerformanceWatchRequest) returns (stream PerformanceEvent);
  rpc QuerySeries (PerformanceQuerySeriesRequest) returns (PerformanceQuerySeriesReply);
  rpc Aggregate (PerformanceAggregateRequest) returns (PerformanceAggregateReply);
}

// Typed operation messages for the API 1.4 services. Common identity,
// revision, pagination and idempotency values remain explicit protobuf fields.
message CustomLaunchRemoveRequest { MutationContext mutation = 1; string game_id = 2; string recipe_id = 3; }
message GameInstallRequest { ServiceContext context = 1; string game_id = 2; string installation_id = 3; string user_intent_id = 4; string idempotency_key = 5; }
message StorageGetRequest { ServiceContext context = 1; string key = 2; }
message StoragePutRequest { MutationContext mutation = 1; string key = 2; bytes value = 3; StorageDurability durability = 4; uint64 ttl_seconds = 5; }
message StorageDeleteRequest { MutationContext mutation = 1; string key = 2; }
enum StorageDurability { STORAGE_DURABILITY_UNSPECIFIED = 0; STORAGE_DURABILITY_SESSION_ONLY = 1; STORAGE_DURABILITY_PERSISTENT = 2; }
message StorageGetReply { bytes value = 1; uint64 revision = 2; bool found = 3; }
message StorageMutationReply { uint64 revision = 1; uint64 usage_bytes = 2; uint64 quota_bytes = 3; MutationOutcome outcome = 4; }
message FilesRequestAccessRequest { MutationContext mutation = 1; string game_id = 2; string installation_id = 3; repeated string requested_operations = 4; repeated string resource_kinds = 5; }
message FileHandle { string handle = 1; string display_name = 2; string resource_kind = 3; bool writable = 4; }
message FileAccessReply { repeated FileHandle handles = 1; }
message FilesListRequest { ServiceContext context = 1; string directory_handle = 2; string cursor = 3; uint32 page_size = 4; }
message FilesListReply { repeated FileEntry entries = 1; string next_cursor = 2; }
message FileEntry { string handle = 1; string name = 2; bool directory = 3; uint64 size_bytes = 4; int64 modified_at = 5; }
message FilesReadRequest { ServiceContext context = 1; string file_handle = 2; uint64 offset = 3; uint64 max_bytes = 4; }
message FileReadReply { bytes contents = 1; uint64 next_offset = 2; bool eof = 3; }
message FilesWriteRequest { MutationContext mutation = 1; string file_handle = 2; uint64 offset = 3; bytes contents = 4; bool truncate = 5; }
message FilesDeleteRequest { MutationContext mutation = 1; string file_handle = 2; }
message NetworkFetchRequest { ServiceContext context = 1; string url = 2; string method = 3; map<string,string> headers = 4; bytes body = 5; uint64 max_response_bytes = 6; uint32 timeout_ms = 7; }
message NetworkFetchReply { uint32 status_code = 1; map<string,string> headers = 2; bytes body = 3; string final_origin = 4; }
message NotificationPublishRequest { MutationContext mutation = 1; string title = 2; string body = 3; string locale = 4; string severity = 5; }
message BackupsListRequest { PageRequest page = 1; string game_id = 2; string profile_id = 3; }
message BackupCreateRequest { MutationContext mutation = 1; string game_id = 2; string profile_id = 3; string reason = 4; }
message BackupRestoreRequest { MutationContext mutation = 1; string backup_id = 2; string game_id = 3; string profile_id = 4; string user_intent_id = 5; }
message BackupsListReply { repeated BackupRecord backups = 1; string next_cursor = 2; }
message BackupRecord { string backup_id = 1; string game_id = 2; int64 created_at = 3; uint64 size_bytes = 4; string state = 5; }
message JobReply { string job_id = 1; JobState state = 2; string result_code = 3; string message = 4; uint64 revision = 5; }
enum JobState { JOB_STATE_UNSPECIFIED = 0; JOB_STATE_QUEUED = 1; JOB_STATE_RUNNING = 2; JOB_STATE_SUCCEEDED = 3; JOB_STATE_FAILED = 4; JOB_STATE_CANCELLED = 5; }
message DomainListRequest { PageRequest page = 1; string kind = 2; string owner_filter = 3; }
message DomainGetRequest { ServiceContext context = 1; string resource_id = 2; uint64 expected_revision = 3; CommonDataSelector shared_records = 4; }
message DomainWatchRequest { ServiceContext context = 1; uint64 after_revision = 2; string resource_id = 3; CommonDataSelector shared_records = 4; }
message DomainRemoveRequest { MutationContext mutation = 1; string resource_id = 2; }
message LibraryCreateRequest { MutationContext mutation = 1; string name = 2; string description = 3; }
message LibraryUpdateRequest { MutationContext mutation = 1; string library_id = 2; string name = 3; string description = 4; repeated string field_mask = 5; }
message LibraryRootAddRequest { MutationContext mutation = 1; string library_id = 2; string approved_root_handle = 3; string display_name = 4; }
message LibraryRootUpdateRequest { MutationContext mutation = 1; string library_id = 2; string root_id = 3; string approved_root_handle = 4; string display_name = 5; }
message LibraryRootRemoveRequest { MutationContext mutation = 1; string library_id = 2; string root_id = 3; }
message LibraryRecord { string id = 1; string name = 2; string creator_plugin_id = 3; repeated string root_ids = 4; uint64 revision = 5; }
message LibrariesListReply { repeated LibraryRecord libraries = 1; string next_cursor = 2; uint64 revision = 3; }
message LibraryRecordReply { LibraryRecord library = 1; uint64 revision = 2; }
message LibraryRecordEvent { uint64 revision = 1; string event_type = 2; LibraryRecord library = 3; }
message LibraryMutationReply { string resource_id = 1; uint64 revision = 2; MutationOutcome outcome = 3; }
message RuntimeRegisterRequest { MutationContext mutation = 1; RuntimeRecord runtime = 2; }
message RuntimeUpdateRequest { MutationContext mutation = 1; RuntimeRecord runtime = 2; repeated string field_mask = 3; }
message RuntimeMutationReply { RuntimeRecord runtime = 1; MutationOutcome outcome = 2; }
message RuntimeRecordReply { RuntimeRecord runtime = 1; uint64 revision = 2; }
message RuntimeRecordEvent { uint64 revision = 1; string event_type = 2; RuntimeRecord runtime = 3; }
message RuntimesListReply { repeated RuntimeRecord runtimes = 1; string next_cursor = 2; uint64 revision = 3; }
message ContentRegistrationRequest { MutationContext mutation = 1; string game_id = 2; string installation_id = 3; string content_handle = 4; string content_kind = 5; string runtime_id = 6; repeated string supported_platforms = 7; }
message ReportMutationReply { string report_id = 1; uint64 revision = 2; MutationOutcome outcome = 3; }
message BenchmarkReportRequest { MutationContext mutation = 1; string volume_handle = 2; string tool_name = 3; string tool_version = 4; map<string,double> measurements = 5; string units = 6; int64 observed_at = 7; }
message SmartReportRequest { MutationContext mutation = 1; string volume_handle = 2; string device_model = 3; string firmware = 4; map<string,string> attributes = 5; int64 observed_at = 6; }
message HardwareReportRequest { MutationContext mutation = 1; string computer_id = 2; string schema_id = 3; uint32 schema_version = 4; google.protobuf.Struct observations = 5; int64 observed_at = 6; }
message PresencePublishRequest { MutationContext mutation = 1; string game_id = 2; string session_id = 3; google.protobuf.Struct details = 4; uint64 ttl_seconds = 5; }
message PresenceClearRequest { MutationContext mutation = 1; string game_id = 2; string session_id = 3; }
message PerformanceSample { int64 observed_at = 1; double frames_per_second = 2; double cpu_percent = 3; uint64 memory_bytes = 4; uint64 sequence = 5; }
message PerformanceSamplesRequest { MutationContext mutation = 1; string series_id = 2; string game_id = 3; string computer_id = 4; repeated PerformanceSample samples = 5; }
message PerformanceEndSeriesRequest { MutationContext mutation = 1; string series_id = 2; int64 ended_at = 3; }
message DataPublishRequest { MutationContext mutation = 1; string dataset_id = 2; string schema_id = 3; uint32 schema_version = 4; google.protobuf.Struct value = 5; StorageDurability durability = 6; uint64 ttl_seconds = 7; }
message DataMutationReply { string record_id = 1; uint64 revision = 2; int64 expires_at = 3; MutationOutcome outcome = 4; }
message DataGetRequest { ServiceContext context = 1; string dataset_id = 2; string record_id = 3; CommonDataSelector common_data_categories = 4; }
message DataListRequest { PageRequest page = 1; string dataset_id = 2; string filter = 3; CommonDataSelector common_data_categories = 4; }
message DataWatchRequest { ServiceContext context = 1; string dataset_id = 2; uint64 after_revision = 3; CommonDataSelector common_data_categories = 4; }
message DataRecord { string record_id = 1; string dataset_id = 2; string publisher_id = 3; uint64 revision = 4; google.protobuf.Struct value = 5; }
message DataGetReply { DataRecord record = 1; }
message DataListReply { repeated DataRecord records = 1; string next_cursor = 2; }
message DataEvent { uint64 revision = 1; string event_type = 2; DataRecord record = 3; }
message PersistenceUsageRequest { ServiceContext context = 1; }
message PersistenceUsageReply { uint64 logical_bytes = 1; uint64 physical_bytes = 2; uint64 quota_bytes = 3; }
message PersistenceListRequest { PageRequest page = 1; string category = 2; }
message PersistenceListReply { repeated PersistenceEntry entries = 1; string next_cursor = 2; }
message PersistenceEntry { string entry_id = 1; string category = 2; string logical_key = 3; uint64 size_bytes = 4; int64 last_used_at = 5; }
message PersistenceDeleteRequest { MutationContext mutation = 1; repeated string entry_ids = 2; }
message PersistenceClearRequest { MutationContext mutation = 1; string category = 2; }
message RetentionPolicyRequest { MutationContext mutation = 1; string category = 2; uint64 max_age_seconds = 3; uint64 max_bytes = 4; }
message PersistenceMutationReply { uint64 reclaimed_bytes = 1; uint64 revision = 2; MutationOutcome outcome = 3; }
message ToolsListRequest { PageRequest page = 1; string game_id = 2; string platform = 3; }
message ToolApplyRequest { MutationContext mutation = 1; string tool_id = 2; string game_id = 3; string user_intent_id = 4; }
message ToolRemoveRequest { MutationContext mutation = 1; string tool_id = 2; string game_id = 3; string user_intent_id = 4; }
message ToolsListReply { repeated ToolRecord tools = 1; string next_cursor = 2; }
message ToolRecord { string tool_id = 1; string name = 2; string version = 3; string availability = 4; }
message PortsListRequest { PageRequest page = 1; string platform = 2; string query = 3; }
message PortDetailRequest { ServiceContext context = 1; string port_id = 2; }
message PortInstallRequest { MutationContext mutation = 1; string port_id = 2; string game_id = 3; repeated string supplied_file_handles = 4; string user_intent_id = 5; }
message PortsListReply { repeated PortRecord ports = 1; string next_cursor = 2; }
message PortDetailReply { PortRecord port = 1; }
message PortRecord { string port_id = 1; string name = 2; string platform = 3; string availability = 4; }
message JobGetRequest { ServiceContext context = 1; string job_id = 2; }
message JobWatchRequest { ServiceContext context = 1; string job_id = 2; uint64 after_sequence = 3; }
message JobCancelRequest { MutationContext mutation = 1; string job_id = 2; }
message JobEvent { string job_id = 1; uint64 sequence = 2; JobState state = 3; uint32 progress_percent = 4; string result_code = 5; string message = 6; }

// Shared mutation envelope. operation_id is host-issued; idempotency_key is
// client supplied and scoped to the authenticated plugin and operation.
message MutationContext {
  ServiceContext context = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  uint64 expected_revision = 4;
}

message PageRequest {
  ServiceContext context = 1;
  string cursor = 2;
  uint32 page_size = 3;
  CommonDataSelector common_data_categories = 4;
}
message LibraryListRequest { PageRequest page = 1; string provider_id = 2; string search = 3; }
message LibraryGetRequest { ServiceContext context = 1; string game_id = 2; string installation_id = 3; CommonDataSelector common_data_categories = 4; }
message LibraryWatchRequest { ServiceContext context = 1; uint64 after_revision = 2; string provider_id = 3; CommonDataSelector common_data_categories = 4; }
message MetadataUpdateRequest { MutationContext mutation = 1; string game_id = 2; string installation_id = 3; map<string, string> display_fields = 4; }
message FavoritesListRequest { PageRequest page = 1; string profile_id = 2; }
message FavoritesSetRequest { MutationContext mutation = 1; string profile_id = 2; string game_id = 3; bool favorite = 4; }
message MatchingSearchRequest { ServiceContext context = 1; string query = 2; string platform = 3; uint32 page_size = 4; string cursor = 5; }
message MatchingAssignRequest { MutationContext mutation = 1; string provider_id = 2; string provider_game_id = 3; string gamenode_game_id = 4; }
message ArtworkReadRequest { ServiceContext context = 1; string game_id = 2; string installation_id = 3; string artwork_kind = 4; uint64 max_bytes = 5; }
message ArtworkSetRequest { MutationContext mutation = 1; string game_id = 2; string installation_id = 3; string artwork_kind = 4; bytes encoded_image = 5; string media_type = 6; }
message LibraryListReply { repeated LibraryEntry entries = 1; string next_cursor = 2; uint64 revision = 3; }
message LibraryGetReply { LibraryEntry entry = 1; uint64 revision = 2; }
message FavoritesListReply { repeated FavoriteEntry entries = 1; string next_cursor = 2; uint64 revision = 3; }
message MatchingSearchReply { repeated MatchCandidate candidates = 1; string next_cursor = 2; }
message ArtworkReadReply { bytes encoded_image = 1; string media_type = 2; uint64 byte_length = 3; uint64 revision = 4; }
message MutationReply { string resource_id = 1; uint64 revision = 2; MutationOutcome outcome = 3; }
enum MutationOutcome { MUTATION_OUTCOME_UNSPECIFIED = 0; MUTATION_OUTCOME_APPLIED = 1; MUTATION_OUTCOME_ALREADY_APPLIED = 2; MUTATION_OUTCOME_REVISION_CONFLICT = 3; }
message LibraryEntry { string game_id = 1; string installation_id = 2; string provider_id = 3; string name = 4; string version = 5; string install_state = 6; uint64 revision = 7; }
message FavoriteEntry { string game_id = 1; bool favorite = 2; uint64 revision = 3; }
message MatchCandidate { string game_id = 1; string title = 2; string platform = 3; string confidence = 4; }
message LibraryEvent { uint64 revision = 1; string event_type = 2; LibraryEntry entry = 3; }

message ResourceRequest {
  ServiceContext context = 1;
  string resource_id = 2;
  string operation_id = 3;
  string idempotency_key = 4;
  uint64 expected_revision = 5;
  string cursor = 6;
  uint32 page_size = 7;
  uint64 max_bytes = 8;
  string durability = 9;
  bytes payload = 10;
  // Deprecated API 1.4 draft fields. Kept at their original wire numbers so
  // clients compiled against the draft remain wire-decodable; hosts MUST NOT
  // use these untyped fields to authorize or include shared records.
  bool include_common = 11 [deprecated = true];
  repeated string selected_categories = 12 [deprecated = true];
  // Omitted or empty means private/owner-visible records only. Each requested
  // category is independently checked against the caller's current grant.
  CommonDataSelector common_data_categories = 13;
}

// Explicit, per-query selector for published projections. Category grants and
// selected-record grants are independently checked by the host; this selector
// never grants authority or triggers automatic reads. Sensitive/custom fields
// still require their separate sharing review, and secrets are excluded.
message CommonDataSelector {
  repeated CommonDataCategory categories = 1;
  // Explicit ids are independently checked against selected-record grants;
  // they do not require or imply a category-wide grant.
  repeated string selected_record_ids = 2;
}

enum CommonDataCategory {
  COMMON_DATA_CATEGORY_UNSPECIFIED = 0;
  COMMON_DATA_CATEGORY_GAME_PATHS = 1;
  COMMON_DATA_CATEGORY_GAME_PERFORMANCE_HISTORY = 2;
  COMMON_DATA_CATEGORY_RUNTIME_CATALOG = 3;
  COMMON_DATA_CATEGORY_CONTENT_AVAILABILITY = 4;
  COMMON_DATA_CATEGORY_LIBRARY_ROOTS = 5;
  COMMON_DATA_CATEGORY_SAVE_PROFILES = 6;
}

message SaveProfileListRequest {
  ServiceContext context = 1;
  string game_id = 2;
  string installation_id = 3;
  string cursor = 4;
  uint32 page_size = 5;
  CommonDataSelector shared_records = 6;
}
message SaveProfileGetRequest { ServiceContext context = 1; string game_id = 2; string profile_id = 3; CommonDataSelector shared_records = 4; }
