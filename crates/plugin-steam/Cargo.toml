[package]
name = "gamenode-plugin-steam"
description = "Official Linux Steam discovery plugin for GameNode Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gamenode-core.workspace = true
gamenode-platform.workspace = true
gamenode-plugin-protocol = { path = "../plugin-protocol" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tonic = { version = "0.14", features = ["transport"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
